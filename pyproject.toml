[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diploid-mesh"
version = "0.1.0"
description = "Mesh peer integration for diploid-agent — bidirectional agent-to-agent mesh communication."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "diploid-agent>=0.4.0",
    "mesh-peer-registry>=0.1.7",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/emiltsoi/diploid-mesh"
Repository = "https://github.com/emiltsoi/diploid-mesh.git"
Issues = "https://github.com/emiltsoi/diploid-mesh/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.20",
    "ruff>=0.5",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "fleet: fleet interop suite (hermes-mesh <-> diploid-mesh dual-boot)",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
