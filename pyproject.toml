[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diploid-mesh"
version = "0.1.0"
description = "Mesh peer integration for diploid-agent — bidirectional agent-to-agent mesh communication."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "diploid-agent>=0.4.0",
    "mesh-peer-registry>=0.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.20",
    "ruff>=0.5",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "fleet: fleet interop suite (hermes-mesh <-> diploid-mesh dual-boot)",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
