name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  # Dummy key for tests that instantiate AcpClient but never start a real ACP child.
  WINDSURF_API_KEY: ci-test-key-not-real

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: emiltsoi/mesh-peer-registry
          path: mesh-peer-registry

      - uses: actions/checkout@v4
        with:
          repository: emiltsoi/diploid-agent
          path: diploid-agent

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ./mesh-peer-registry
          pip install -e ./diploid-agent
          pip install -e . --no-deps
          pip install pytest respx ruff

      - name: Lint
        run: ruff check src tests

      - name: Format check
        run: ruff format --check src tests

      - name: Test
        run: pytest tests
