name: CI

on:
  push:
    branches: [master, main]
    tags: ['**']
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [master, main]

env:
  # Dummy key for tests that instantiate AcpClient but never start a real ACP child.
  WINDSURF_API_KEY: ci-test-key-not-real

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: emiltsoi/mesh-peer-registry
          path: mesh-peer-registry

      - uses: actions/checkout@v4
        with:
          repository: emiltsoi/diploid-agent
          path: diploid-agent

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Privacy scan
        shell: bash
        run: |
          python probes/privacy_scan.py --worktree
          python probes/privacy_scan.py --github-event "$GITHUB_EVENT_PATH"
          if [ "${{ github.event_name }}" = "push" ]; then
            if [ "${{ github.ref_type }}" = "tag" ]; then
              # github.sha is the peeled commit even for annotated tags. Resolve
              # the pushed ref itself so tag-object messages are really scanned;
              # lightweight tags resolve to commits and are correctly clean here.
              tag_object=$(git rev-parse "${{ github.ref }}" 2>/dev/null || true)
              if [ -z "$tag_object" ]; then
                git fetch origin "+${{ github.ref }}:${{ github.ref }}"
                tag_object=$(git rev-parse "${{ github.ref }}")
              fi
              python probes/privacy_scan.py --scan-tag-object "$tag_object"
              scan_target=$(git rev-parse "${{ github.ref }}^{commit}")
              before=$(git merge-base "$scan_target" origin/main 2>/dev/null || true)
            else
              before="${{ github.event.before }}"
              scan_target="${{ github.sha }}"
              if [ "$before" = "0000000000000000000000000000000000000000" ]; then
                # Orphan branches may have no merge base; then only the tip tree is scanned.
                before=$(git merge-base "$scan_target" origin/main 2>/dev/null || true)
              fi
            fi
            if [ -n "$before" ]; then
              python probes/privacy_scan.py --range "$before..$scan_target"
            else
              python probes/privacy_scan.py --tree "$scan_target"
            fi
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            python probes/privacy_scan.py --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ./mesh-peer-registry
          pip install -e ./diploid-agent
          pip install -e . --no-deps
          pip install pytest respx ruff pyyaml

      - name: Lint
        run: ruff check src tests

      - name: Format check
        run: ruff format --check src tests

      - name: Test
        run: pytest tests
