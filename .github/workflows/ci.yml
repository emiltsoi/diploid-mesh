name: CI

on:
  push:
    branches: [master, main]
    tags: ['**']
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [master, main]

env:
  # Dummy key for tests that instantiate AcpClient but never start a real ACP child.
  WINDSURF_API_KEY: ci-test-key-not-real

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve privacy scan canonical commit
        id: privacy-scan-source
        shell: bash
        run: |
          commit=$(python3 -c 'import json; print(json.load(open("probes/privacy-scan-source.json"))["canonical_commit"])')
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: emiltsoi/diploid-agent
          path: privacy-scan-canonical
          ref: ${{ steps.privacy-scan-source.outputs.commit }}

      - uses: actions/checkout@v4
        with:
          repository: emiltsoi/mesh-peer-registry
          path: mesh-peer-registry

      - uses: actions/checkout@v4
        with:
          repository: emiltsoi/diploid-agent
          path: diploid-agent

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Privacy scan
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash probes/privacy-ci-scan

      - name: Privacy scan sync
        shell: bash
        run: python probes/check_privacy_scan_sync.py --canonical-root privacy-scan-canonical

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ./mesh-peer-registry
          pip install -e ./diploid-agent
          pip install -e . --no-deps
          pip install pytest respx ruff pyyaml

      - name: Lint
        run: ruff check src tests

      - name: Format check
        run: ruff format --check src tests

      - name: Test
        run: pytest tests
